<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Jewelry | Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="section">
  <div class="container" style="max-width:720px;">
    <div class="card card-glow">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-3">Create your account</h1>
        <form class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label" for="fullName">Full name</label>
            <input type="text" class="form-control" id="fullName" required>
            <div class="invalid-feedback">Enter your full name.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="signupEmail">Email</label>
            <input type="email" class="form-control" id="signupEmail" required>
            <div class="invalid-feedback">Enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
            <div class="invalid-feedback">Password must be at least 6 characters.</div>
          </div>
          <button class="btn-gold" type="submit">Sign Up</button>
        </form>
      </div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
