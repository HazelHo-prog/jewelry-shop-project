<body>
   
    <div class="container mt-5">

<h1>Contact Us</h1>

<form onsubmit="return validateForm()">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
id="name"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
id="email">

</div>

<div class="mb-3">

<label>Message</label>

<textarea
class="form-control"
id="message">
</textarea>

</div>

<button
type="submit"
class="btn btn-dark">

Send

</button>

</form>

</div>

<script>

function validateForm(){

let email =
document.getElementById(
"email"
).value;

if(email==""){

alert(
"Please enter email"
);

return false;

}

alert(
"Message sent successfully"
);

return true;

}

</script>
